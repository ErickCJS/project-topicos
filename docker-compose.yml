
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: project_topicos_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - mysql
    networks:
      - project_network

  nginx:
    image: nginx:alpine
    container_name: project_topicos_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - project_network

  mysql:
    image: mysql:8.0
    container_name: project_topicos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: project_topicos
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - project_network

volumes:
  mysql_data:
  vendor_data:
networks:
  project_network:
    driver: bridge
