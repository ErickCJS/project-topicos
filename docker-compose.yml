
services:
  app:
    image: eltiti07/project_rsu:latest
    container_name: laravel_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: project_topicos
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel123
    volumes:
      - laravel_storage:/var/www/html/storage/app/public
    networks:
      - laravel_network
    depends_on:
      - db

  nginx:
    image: eltiti07/nginx-laravel:1.0
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - laravel_storage:/var/www/html/public/storage:ro
    networks:
      - laravel_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    ports:
    - "3307:3306"
    environment:
      MYSQL_DATABASE: project_topicos
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - laravel_network

volumes:
  mysql_data:
  laravel_storage:

networks:
  laravel_network:
    driver: bridge
